services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: development
      AI_PROVIDER: mock
      VERIREVIEW_API_KEY: ${VERIREVIEW_API_KEY:-}
    read_only: true
    tmpfs:
      - /tmp:size=128m
    security_opt:
      - no-new-privileges:true
